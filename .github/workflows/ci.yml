name: Quality checks and manual production deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: |
          npm run lint
          npm run format:check
          npm test -- --run
          npm run build

  deploy:
    name: Manually build and deploy production image
    needs: quality
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      YC_OIDC_AUDIENCE: https://github.com/UBAS-KurganDev
      YC_SERVICE_ACCOUNT_ID: aje5uv722diotvqdgqb1
      YC_REGISTRY: registry.yandexcloud.net
      YC_REGISTRY_ID: cn12qrbnsnck5l6a3en0
      VM_HOST: 153.51.167.77
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Exchange GitHub OIDC token for Yandex Cloud IAM token
        id: yc_auth
        shell: bash
        run: |
          set -euo pipefail

          oidc_audience="${YC_OIDC_AUDIENCE//:/%3A}"
          oidc_audience="${oidc_audience//\//%2F}"
          oidc_response="$({
            curl --fail --silent --show-error \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${oidc_audience}"
          })"
          oidc_token="$(jq --exit-status --raw-output '.value' <<<"${oidc_response}")"
          echo "::add-mask::${oidc_token}"

          iam_response_file="$(mktemp)"
          trap 'rm -f "${iam_response_file}"' EXIT
          iam_status="$({
            curl --silent --show-error \
              --output "${iam_response_file}" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
              --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
              --data-urlencode "audience=${YC_SERVICE_ACCOUNT_ID}" \
              --data-urlencode "subject_token=${oidc_token}" \
              --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
              https://auth.yandex.cloud/oauth/token
          })"
          if [[ "${iam_status}" != "200" ]]; then
            error_message="$({
              jq --compact-output \
                '{error, error_description}' \
                "${iam_response_file}"
            } 2>/dev/null || printf '%s' 'unparseable response')"
            echo "Yandex IAM token exchange failed (HTTP ${iam_status}): ${error_message}" >&2
            exit 1
          fi
          iam_token="$(jq --exit-status --raw-output '.access_token' "${iam_response_file}")"
          echo "::add-mask::${iam_token}"
          printf 'iam_token=%s\n' "${iam_token}" >>"${GITHUB_OUTPUT}"

      - name: Build and push images
        shell: bash
        env:
          IAM_TOKEN: ${{ steps.yc_auth.outputs.iam_token }}
        run: |
          set -euo pipefail
          immutable_image="${YC_REGISTRY}/${YC_REGISTRY_ID}/ubas-frontend:${GITHUB_SHA}"
          master_image="${YC_REGISTRY}/${YC_REGISTRY_ID}/ubas-frontend:master"
          trap 'docker logout "${YC_REGISTRY}" >/dev/null 2>&1 || true' EXIT

          printf '%s' "${IAM_TOKEN}" | docker login \
            --username iam \
            --password-stdin \
            "${YC_REGISTRY}"
          docker build \
            --pull \
            --build-arg VITE_API_URL= \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${immutable_image}" \
            --tag "${master_image}" \
            .
          docker push "${immutable_image}"
          docker push "${master_image}"

      - name: Wait for VM deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            deployed="$({
              curl --silent --show-error \
                --max-time 5 \
                "http://${VM_HOST}/__frontend_version"
            } || true)"
            if [[ "${deployed}" == "${GITHUB_SHA}" ]]; then
              curl --fail --silent --show-error \
                "http://${VM_HOST}/" \
                >/dev/null
              echo "Frontend VM is running ${GITHUB_SHA}"
              exit 0
            fi
            echo "Waiting for frontend deployment (${attempt}/90), current=${deployed:-none}"
            sleep 10
          done
          echo "VM did not deploy frontend ${GITHUB_SHA} within 15 minutes" >&2
          exit 1
