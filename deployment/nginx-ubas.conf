upstream ubas_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream ubas_frontend {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 2m;

    location = /__version {
        alias /opt/ubas/current-release;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    location = /__frontend_version {
        alias /opt/ubas-frontend/current-release;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    location = /openapi.json {
        proxy_pass http://ubas_backend;
        include proxy_params;
    }

    location = /docs {
        proxy_pass http://ubas_backend;
        include proxy_params;
    }

    location = /docs/oauth2-redirect {
        proxy_pass http://ubas_backend;
        include proxy_params;
    }

    location = /redoc {
        proxy_pass http://ubas_backend;
        include proxy_params;
    }

    location /api/ {
        proxy_pass http://ubas_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://ubas_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
